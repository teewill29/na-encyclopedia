# Build, validate and package NA Encyclopedia Vol. IV on every push to main.
name: Build macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# macOS minutes are expensive: a newer push cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTEFACTS: build/volumes/04-compression/NAEncyclopediaCompression_artefacts/Release
  PLUGIN_NAME: NA Encyclopedia IV Compression
  AU_ID: aufx NE04 Tywl
  AU_DISPLAY_NAME: "Noveltee Audio: NA Encyclopedia IV Compression"
  BUNDLE_ID: com.novelteeaudio.naencyclopedia.compression

jobs:
  build:
    runs-on: macos-15   # macos-14 is retired
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the pinned JUCE tag from CMakeLists.txt
        id: juce
        run: |
          tag=$(grep -E '^\s*GIT_TAG\s+' CMakeLists.txt | head -1 | awk '{print $2}')
          test -n "$tag"
          echo "Pinned JUCE tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache JUCE source
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ~/juce-src
          key: juce-src-${{ steps.juce.outputs.tag }}

      - name: Download JUCE (cache miss only)
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${{ steps.juce.outputs.tag }}" https://github.com/juce-framework/JUCE.git ~/juce-src

      - name: Install Ninja
        run: command -v ninja || brew install ninja

      - name: Configure (Release, universal)
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$HOME/juce-src"

      - name: Build AU and VST3
        run: cmake --build build --parallel

      - name: Check the binaries are universal
        run: |
          for b in "$ARTEFACTS/AU/$PLUGIN_NAME.component" "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"; do
            lipo -info "$b/Contents/MacOS/$PLUGIN_NAME"
            lipo "$b/Contents/MacOS/$PLUGIN_NAME" -verify_arch arm64 x86_64
          done

      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - "$ARTEFACTS/AU/$PLUGIN_NAME.component"
          codesign --force --deep -s - "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3"

      - name: Build installer (.pkg)
        run: |
          installer/build-pkg.sh \
            "$ARTEFACTS/AU/$PLUGIN_NAME.component" \
            "$ARTEFACTS/VST3/$PLUGIN_NAME.vst3" \
            "$BUNDLE_ID" "$PLUGIN_NAME" build/pkg
          PKG=$(ls build/pkg/*.pkg)
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Install the .pkg on this runner, exactly like on a real Mac
        run: |
          sudo installer -pkg "$PKG" -target / -verboseR
          test -d "/Library/Audio/Plug-Ins/Components/$PLUGIN_NAME.component" \
            || { echo "::error::Installer did not put the AU in /Library/Audio/Plug-Ins/Components"; exit 1; }
          test -d "/Library/Audio/Plug-Ins/VST3/$PLUGIN_NAME.vst3" \
            || { echo "::error::Installer did not put the VST3 in /Library/Audio/Plug-Ins/VST3"; exit 1; }
          codesign --verify --deep --strict "/Library/Audio/Plug-Ins/Components/$PLUGIN_NAME.component"

      - name: auval the installed AU
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          for i in $(seq 1 20); do
            auval -a 2>/dev/null | grep -q "$AU_ID" && break
            echo "Waiting for macOS to register the AU ($i)..."
            sleep 3
          done
          set +e
          auval -strict -v $AU_ID | tee auval.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || ! grep -q "AU VALIDATION SUCCEEDED" auval.log; then
            echo "::error::auval failed"
            exit 1
          fi
          # The name Logic shows: developer and plugin.
          auval -a | grep "$AU_ID" | tee auname.log
          grep -q "$AU_DISPLAY_NAME" auname.log \
            || { echo "::error::AU is not registered as '$AU_DISPLAY_NAME'"; exit 1; }
          # Mono tracks: Logic hides plugins that can't run mono->mono or mono->stereo.
          grep -E "1-1|1-2" auval.log || true

      - name: Cache pluginval
        id: pluginval-cache
        uses: actions/cache@v4
        with:
          path: pluginval.app
          key: pluginval-macos-v1

      - name: Download pluginval (cache miss only, with retries)
        if: steps.pluginval-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip

      - name: pluginval (strictness 10, VST3)
        run: |
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 \
            --validate-in-process \
            --verbose \
            --validate "/Library/Audio/Plug-Ins/VST3/$PLUGIN_NAME.vst3"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NAEncyclopedia-IV-Compression-pkg
          path: ${{ env.PKG }}
          if-no-files-found: error
          retention-days: 30
