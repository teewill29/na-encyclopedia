# Build, test, validate and package every NA Encyclopedia volume on every push, any branch.
name: Build macOS

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# macOS minutes are expensive: a newer push cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One line per volume: folder | CMake target | product name | plugin code | bundle ID | artifact name
env:
  VOLUMES: |
    01-gain-staging|NAEncyclopediaGainStaging|NA Encyclopedia I Gain Staging|NE01|com.novelteeaudio.naencyclopedia.gainstaging|NAEncyclopedia-I-GainStaging-pkg
    03-eq|NAEncyclopediaEQ|NA Encyclopedia III EQ|NE03|com.novelteeaudio.naencyclopedia.eq|NAEncyclopedia-III-EQ-pkg
    04-compression|NAEncyclopediaCompression|NA Encyclopedia IV Compression|NE04|com.novelteeaudio.naencyclopedia.compression|NAEncyclopedia-IV-Compression-pkg
  MANUFACTURER: Tywl
  COMPANY: Noveltee Audio

jobs:
  build:
    runs-on: macos-15   # macos-14 is retired
    timeout-minutes: 75

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the pinned JUCE tag from CMakeLists.txt
        id: juce
        run: |
          tag=$(grep -E '^\s*GIT_TAG\s+' CMakeLists.txt | head -1 | awk '{print $2}')
          test -n "$tag"
          echo "Pinned JUCE tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache JUCE source
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ~/juce-src
          key: juce-src-${{ steps.juce.outputs.tag }}

      - name: Download JUCE (cache miss only)
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${{ steps.juce.outputs.tag }}" https://github.com/juce-framework/JUCE.git ~/juce-src

      - name: Install Ninja
        run: command -v ninja || brew install ninja

      - name: Configure (Release, universal)
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$HOME/juce-src"

      - name: Build every volume and the tests
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check universal binaries and ad-hoc sign
        run: |
          while IFS='|' read -r dir target product code bundle artifact; do
            [ -n "$dir" ] || continue
            art="build/volumes/$dir/${target}_artefacts/Release"
            for b in "$art/AU/$product.component" "$art/VST3/$product.vst3"; do
              lipo -info "$b/Contents/MacOS/$product"
              lipo "$b/Contents/MacOS/$product" -verify_arch arm64 x86_64
              codesign --force --deep -s - "$b"
            done
          done <<< "$VOLUMES"

      - name: Build an installer (.pkg) per volume
        run: |
          while IFS='|' read -r dir target product code bundle artifact; do
            [ -n "$dir" ] || continue
            art="build/volumes/$dir/${target}_artefacts/Release"
            installer/build-pkg.sh "$art/AU/$product.component" "$art/VST3/$product.vst3" \
              "$bundle" "$product" "build/pkg/$dir"
          done <<< "$VOLUMES"
          ls -R build/pkg

      - name: Install every .pkg on this runner, exactly like on a real Mac
        run: |
          while IFS='|' read -r dir target product code bundle artifact; do
            [ -n "$dir" ] || continue
            sudo installer -pkg "$(ls build/pkg/$dir/*.pkg)" -target / -verboseR
            test -d "/Library/Audio/Plug-Ins/Components/$product.component" \
              || { echo "::error::$product: AU not installed to /Library/Audio/Plug-Ins/Components"; exit 1; }
            test -d "/Library/Audio/Plug-Ins/VST3/$product.vst3" \
              || { echo "::error::$product: VST3 not installed to /Library/Audio/Plug-Ins/VST3"; exit 1; }
            codesign --verify --deep --strict "/Library/Audio/Plug-Ins/Components/$product.component"
          done <<< "$VOLUMES"

      - name: auval every installed AU
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          while IFS='|' read -r dir target product code bundle artifact; do
            [ -n "$dir" ] || continue
            id="aufx $code $MANUFACTURER"
            for i in $(seq 1 20); do
              auval -a 2>/dev/null | grep -q "$id" && break
              echo "Waiting for macOS to register $product ($i)..."
              sleep 3
            done
            set +e
            auval -strict -v $id | tee "auval-$code.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ] || ! grep -q "AU VALIDATION SUCCEEDED" "auval-$code.log"; then
              echo "::error::auval failed for $product"
              exit 1
            fi
            # The name Logic shows: developer and plugin.
            auval -a | grep "$id" | grep -q "$COMPANY: $product" \
              || { echo "::error::$product is not registered as '$COMPANY: $product'"; exit 1; }
          done <<< "$VOLUMES"

      - name: Cache pluginval
        id: pluginval-cache
        uses: actions/cache@v4
        with:
          path: pluginval.app
          key: pluginval-macos-v1

      - name: Download pluginval (cache miss only, with retries)
        if: steps.pluginval-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip

      - name: pluginval every VST3 (strictness 10)
        run: |
          while IFS='|' read -r dir target product code bundle artifact; do
            [ -n "$dir" ] || continue
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
              --validate "/Library/Audio/Plug-Ins/VST3/$product.vst3"
          done <<< "$VOLUMES"

      - name: Upload Vol. I installer
        uses: actions/upload-artifact@v4
        with:
          name: NAEncyclopedia-I-GainStaging-pkg
          path: build/pkg/01-gain-staging/*.pkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Vol. III installer
        uses: actions/upload-artifact@v4
        with:
          name: NAEncyclopedia-III-EQ-pkg
          path: build/pkg/03-eq/*.pkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Vol. IV installer
        uses: actions/upload-artifact@v4
        with:
          name: NAEncyclopedia-IV-Compression-pkg
          path: build/pkg/04-compression/*.pkg
          if-no-files-found: error
          retention-days: 30
